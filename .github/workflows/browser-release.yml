name: Browser and release verification
on:
  push:
    branches: [reconstruction/stance-rush, main]
  pull_request:
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm install --no-save --no-package-lock playwright
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8000 > /tmp/crime-http.log 2>&1 &
          node crime-rush/tests/browser-smoke.cjs
      - run: |
          mv stance-rush /tmp/stance-rush
          ENGINE_ONLY=1 node crime-rush/tests/browser-smoke.cjs
          mv /tmp/stance-rush stance-rush
      - run: python3 tools/build-release.py all
      - uses: actions/upload-artifact@v6
        with:
          name: crime-rush-releases
          path: dist/*.zip
