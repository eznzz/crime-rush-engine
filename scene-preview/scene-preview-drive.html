const c=cv.getContext('2d');c.imageSmoothingEnabled=false;const I={};let mode=0,paused=false,t=0,distance=0,x=.25*600*((394-183)/(432-183))/450,steer=0,steerInput=0,keys={};const W=864,H=432,hy=183,depth=1800;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function poly(color,...p){c.fillStyle=color;c.beginPath();c.moveTo(...p[0]);for(const v of p.slice(1))c.lineTo(...v);c.closePath();c.fill()}function rect(color,x,y,w,h){c.fillStyle=color;c.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}function img(n,x,y,w,h){if(I[n]?.complete&&I[n].naturalWidth)c.drawImage(I[n],Math.round(x),Math.round(y),Math.round(w),Math.round(h))}function sprite(n,x,y,s,stretch=1){let a=I[n];if(!a?.naturalWidth)return;let w=a.width*s,h=a.height*s*stretch;img(n,x-w/2,y-h,w,h)}function vehicleShadow(name,x,y,h,flip=false){const a=I[name];if(!a?.naturalWidth)return;const w=a.width/a.height*h;const modern=/^rear-(\d+)$/.exec(name);const angle=modern?Number(modern[1]):name==='rear'?0:name.includes('mini')?15:40;const k=clamp(angle/40,0,1);const dir=modern?(flip?-1:1):name.startsWith('left')?-1:1;const P=(u,v)=>[Math.round(x+dir*u*w),Math.round(y+v*h)];const lerp=(a,b)=>a+(b-a)*k;const points=[P(lerp(-.46,-.44),.012),P(lerp(.46,.10),.018),P(lerp(.34,.45),lerp(-.12,-.19)),P(lerp(-.34,.17),lerp(-.12,-.25))];const radius=h*.13;const corners=points.map((p,i)=>{const toward=q=>{const dx=q[0]-p[0],dy=q[1]-p[1],len=Math.hypot(dx,dy);const f=len?Math.min(radius,len*.49)/len:0;return [p[0]+dx*f,p[1]+dy*f]};return {p,entry:toward(points[(i+3)%4]),exit:toward(points[(i+1)%4])}});c.fillStyle='#050507e6';c.beginPath();c.moveTo(...corners[0].entry);for(const corner of corners){c.lineTo(...corner.entry);c.quadraticCurveTo(...corner.p,...corner.exit)}c.closePath();c.fill();}
