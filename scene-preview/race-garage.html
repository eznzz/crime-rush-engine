let helpIndex=0;const helpDialog=$('raceHelpDialog');
function showHelpCard(){const item=helpCards[helpIndex],card=$('raceHelpCard');card.replaceChildren();const title=document.createElement('h3');title.textContent=item.title;card.append(title);for(const body of item.paragraphs||[]){const p=document.createElement('p');p.textContent=body;card.append(p);}for(const [src,name,body] of item.rows||[]){const row=document.createElement('div'),img=document.createElement('img'),desc=document.createElement('div'),strong=document.createElement('strong'),p=document.createElement('p');row.className='obstacleRow';img.src=src;img.alt=name;strong.textContent=name;p.textContent=body;desc.append(strong,p);row.append(img,desc);card.append(row);}$('raceHelpProgress').textContent=(helpIndex+1)+' / '+helpCards.length;$('raceHelpPrev').disabled=helpIndex===0;$('raceHelpNext').disabled=helpIndex===helpCards.length-1;helpDialog.scrollTop=0;}
function moveHelp(d){helpIndex=Math.max(0,Math.min(helpCards.length-1,helpIndex+d));showHelpCard();window.PreviewAudio?.play('menu');}
$('raceHelp').onclick=()=>{helpIndex=0;showHelpCard();helpDialog.showModal();};$('raceHelpPrev').onclick=()=>moveHelp(-1);$('raceHelpNext').onclick=()=>moveHelp(1);$('raceHelpBack').onclick=()=>helpDialog.close();helpDialog.addEventListener('keydown',e=>{if(e.code==='ArrowLeft'||e.code==='ArrowRight'){e.preventDefault();moveHelp(e.code==='ArrowLeft'?-1:1);}});
