<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRIME RUSH / MISSION LAB</title><link rel="stylesheet" href="../../crime-rush-library/support/preview-font.css"><style>body{background:#171620;color:#eee;max-width:800px;margin:32px auto;padding:20px}a{color:#eeb05a}article{border:1px solid #625a74;padding:16px;margin:16px 0}li{margin:10px 0}small{color:#bcb2c6}</style><a href="../../">← CRIME RUSH</a><h1>MISSION LAB</h1><p>Предпросмотр и запуск эталонных миссий.</p><main id="missions"></main><script src="../project/manifest.js"></script><script src="../engine/scenes/mission-model.js"></script><script>const project=CrimeRushMissionModel.validate(CrimeRushProject);for(const m of project.missions.filter(m=>m.enabled)){const a=document.createElement('article'),h=document.createElement('h2'),ol=document.createElement('ol'),link=document.createElement('a');h.textContent=m.title;for(const s of m.stages){const li=document.createElement('li');li.textContent=s.id+' — '+s.kind+(s.objective?' / '+s.objective.kind+' '+(s.objective.target??''):'');ol.append(li)}link.href='../mission.html?id='+encodeURIComponent(m.id);link.textContent='Запустить тест';a.append(h,ol,link);document.getElementById('missions').append(a)}</script></html>
