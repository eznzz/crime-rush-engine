<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SCENE LAB / ROAD ATMOSPHERE</title><link rel="stylesheet" href="../../../crime-rush-library/support/preview-font.css"><link rel="stylesheet" href="../../engine/ui/index.css"><link rel="stylesheet" href="../style.css?v=2"><style>iframe{display:block;width:100%;aspect-ratio:2/1;border:0;background:#171620}fieldset{border:1px solid var(--cr-ui-border);padding:12px;grid-column:1/-1}#roadStatus{color:#f0bc79}.road-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-bottom:8px}#roadPreview:fullscreen,#roadPreview.road-expanded{background:#171620;display:flex;flex-direction:column;padding:8px;box-sizing:border-box;width:100%;height:100%;max-width:none;max-height:none}#roadPreview.road-expanded{position:fixed;inset:0;z-index:9999}#roadPreview:fullscreen iframe,#roadPreview.road-expanded iframe{flex:1;min-height:0;height:100%;aspect-ratio:auto}#roadPreview:fullscreen #roadStatus,#roadPreview.road-expanded #roadStatus{display:none}</style></head><body><header><a href="../">← SCENE LAB</a><h1>ROAD / ATMOSPHERE v2.4</h1><p>Экспериментальный предпросмотр на реальном дорожном рендерере. Игра не изменяется.</p></header><main><section class="cr-panel preview" id="roadPreview"><div class="road-actions"><button type="button" class="cr-button" id="roadSound" aria-pressed="true" disabled>Звук: вкл</button><button type="button" class="cr-button" id="roadFullscreen" aria-pressed="false">На весь экран</button></div><iframe allowfullscreen id="roadFrame" title="Дорожная сцена" src="../../modules/drive/index.html?roadLab=1&amp;v=7"></iframe><p id="roadStatus" role="status">Загрузка дороги...</p></section><section class="cr-panel controls"><label><input type="checkbox" id="legacy" checked> LEGACY DAWN — оригинальный рассвет</label><label>Осадки эталона<select id="legacyRain"><option value="clear">Без дождя</option><option value="rain">Дождь</option><option value="storm">Ливень</option></select></label><fieldset><legend>Новая атмосфера</legend><label>Время суток<select id="time"><option value="day">День</option><option value="dawn">Рассвет</option><option value="sunset">Закат</option><option value="night">Ночь</option></select></label><label>Погода<select id="weather"><option value="clear">Ясно</option><option value="overcast">Пасмурно</option><option value="fog">Туман</option><option value="rain">Дождь</option><option value="storm">Ливень</option><option value="afterrain">После дождя</option></select></label><label>Плотность тумана %<input id="fog" type="range" min="0" max="100" value="2"><output id="fogOut">2%</output></label><label>Влажность дороги %<input id="wet" type="range" min="0" max="100" value="0"><output id="wetOut">0%</output></label><label><input type="checkbox" id="headlights"> Фары</label></fieldset><label><input id="moving" type="checkbox" checked> Движение дороги</label><button class="cr-button" id="export">Экспорт атмосферы JSON</button></section><section class="cr-panel json"><h2>Параметры дорожной сцены</h2><textarea id="json" readonly rows="10"></textarea></section></main><script src="../../../crime-rush-library/presets/atmosphere.js?v=1"></script><script src="editor.js?v=3"></script></body></html>
