<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRIME RUSH LIBRARY</title><link rel="stylesheet" href="support/preview-font.css"><style>body{background:#171620;color:#eed9b5;margin:24px}a{color:#efb567}input{background:#292435;color:inherit;padding:10px;width:min(90%,480px)}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:20px}article{background:#282435;padding:12px;overflow-wrap:anywhere;font-size:12px}img{width:100%;height:120px;object-fit:contain;image-rendering:pixelated;background:#373345}</style><a href="../">← CRIME RUSH</a><h1>CRIME RUSH LIBRARY</h1><input id="filter" placeholder="Поиск ресурса"><p id="count"></p><div id="grid"></div><script src="manifest.js"></script><script>const grid=document.getElementById('grid'),filter=document.getElementById('filter');function draw(){grid.replaceChildren();const paths=CrimeRushResourceManifest.filter(p=>p.toLowerCase().includes(filter.value.toLowerCase()));document.getElementById('count').textContent=paths.length+' ресурсов';for(const p of paths){const a=document.createElement('article'),link=document.createElement('a');link.href=p;link.textContent=p;if(/\.(webp|png|svg|ico)$/.test(p)){const im=new Image();im.loading='lazy';im.src=p;im.alt=p;a.append(im)}a.append(link);grid.append(a)}}filter.oninput=draw;draw();</script></html>
